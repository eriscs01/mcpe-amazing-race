version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Target API versions are pinned deliberately (see docs/amazing-race-addon-spec.md section 2).
      - dependency-name: "@minecraft/server"
      - dependency-name: "@minecraft/server-ui"
      # Node types follow the Node major used in CI and engines (22); patch/minor updates still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
