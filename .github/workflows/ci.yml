name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  code-quality: write # upload coverage
  pull-requests: read # coverage upload finds the PR for push events

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR head, not the merge commit, so coverage lines map onto the diff
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage # tests + Cobertura report (build/coverage)
      - name: Upload coverage
        # fork PRs get no code-quality:write token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: build/coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/c8
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AmazingRace.mcaddon
          path: dist/AmazingRace.mcaddon
