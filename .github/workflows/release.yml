name: Release
# Push a tag vX.Y.Z (matching package.json and manifest versions) to publish the .mcaddon.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package # also checks manifest versions match
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > build/release-notes.md
          cp dist/AmazingRace.mcaddon "dist/AmazingRace-$GITHUB_REF_NAME.mcaddon"
          gh release create "$GITHUB_REF_NAME" "dist/AmazingRace-$GITHUB_REF_NAME.mcaddon" \
            --title "Amazing Race $GITHUB_REF_NAME" --notes-file build/release-notes.md
